apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: my-app-staging
  namespace: argocd
spec:
  commonUpdateSettings:
    updateStrategy: "semver"
    forceUpdate: true
  writeBackConfig:
    method: "git"
    gitConfig:
      repository: "git@github.com:traipoap/argocd-bootstrap.git"
      branch: "main"
      # Kustomize app: the new tag is written back into the `images:` list of
      # apps/my-app/overlays/staging/kustomization.yaml (target must be the
      # kustomization directory, not a values file).
      writeBackTarget: "kustomization:./apps/my-app/overlays/staging"
  applicationRefs:
    # namePattern matches the Argo CD Application name (not the image name).
    # "my-app-staging" is generated by the business-applications ApplicationSet
    # from apps/my-app/overlays/staging, which deploys both backend and frontend.
    # Keep only ONE ImageUpdater CR per application - multiple CRs matching the
    # same app continuously overwrite each other (documented thrashing behavior).
    - namePattern: "my-app-staging"
      images:
        - alias: "backend"
          imageName: "ghcr.io/traipoap/backend:0.0.69"
          manifestTargets:
            kustomize:
              # Must match the `name:` entry in the overlay kustomization's images list
              name: "ghcr.io/traipoap/backend"
        - alias: "frontend"
          imageName: "ghcr.io/traipoap/frontend:0.0.68"
          manifestTargets:
            kustomize:
              name: "ghcr.io/traipoap/frontend"
