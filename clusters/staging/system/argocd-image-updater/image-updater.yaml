apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: my-app-staging
  namespace: argocd
spec:
  applicationRefs:
    # namePattern matches the Argo CD Application name (not the image name).
    # "my-app-staging" is generated by the business-applications ApplicationSet
    # from apps/my-app/overlays/staging, which deploys both backend and frontend.
    # Keep only ONE ImageUpdater CR per application - multiple CRs matching the
    # same app continuously overwrite each other (documented thrashing behavior).
    - namePattern: "my-app-staging"
      images:
        - alias: "backend"
          imageName: "ghcr.io/traipoap/backend:0.0.69"
        - alias: "frontend"
          imageName: "ghcr.io/traipoap/frontend:0.0.68"
