# prometheus.yaml
server:
  resources:
    limits:
      cpu: 256m
      memory: 512Mi
    requests:
      cpu: 128m
      memory: 256Mi

  service:
    type: ClusterIP
    # nodePort: 30090

  # Enable Remote Write Receiver for OTel integration
  extraFlags:
    - web.enable-remote-write-receiver
    - web.enable-lifecycle

  # Enable Persistent Storage
  persistentVolume:
    enabled: true
    size: 4Gi
    storageClass: "" # uses default storage class, change if needed
  # Data retention
  retention: 7d

  # Global settings
  global:
    scrape_interval: 30s
    evaluation_interval: 15s
# Enable Node Exporter for machine metrics (CPU, Memory, Disk)
nodeExporter:
  enabled: true
# Enable Kube State Metrics for cluster level metrics (Deployments, Pods status etc)
kubeStateMetrics:
  enabled: true
