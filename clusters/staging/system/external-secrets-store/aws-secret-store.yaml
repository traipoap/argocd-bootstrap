apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secretstore-aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: awssm-secret
            key: KEYID
            namespace: external-secrets
          secretAccessKeySecretRef:
            name: awssm-secret
            key: SECRETKEY
            namespace: external-secrets
