apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secretstore-aws
  namespace: external-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
      auth:
        secretRef:
          accessKeySecretRef:
            name: awssm-secret
            key: KEYID
          secretKeySecretRef:
            name: awssm-secret
            key: SECRETKEY
