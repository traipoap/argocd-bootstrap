service:
  enabled: true
  type: ClusterIP

resources:
 limits:
   cpu: 512m
   memory: 512Mi
 requests:
   cpu: 1m
   memory: 1Mi

# Enable Persistent Storage
persistence:
  type: pvc
  enabled: true
  size: 2Gi

# Admin configuration
adminUser: admin
## It is recommended to change this on install via --set or secret, but defaults:
# adminPassword: strongpassword
# Provision Prometheus Datasource automatically
datasources:
  enabled: true
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://infra-prometheus-server.prometheus.svc.cluster.local  # Adjust namespace if different
      access: proxy
      isDefault: true
    - name: Loki
      type: loki
      url: http://infra-loki.loki.svc.cluster.local:3100
      access: proxy
# Dashboard Providers - load dashboards from sidecars or files
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default
# Provision Dashboards
## We will load a popular Node Exporter dashboard (ID: 1860) and a Kubernetes Pods dashboard
dashboards:
  default:
    node-exporter-full:
      gnetId: 1860  # Node Exporter Full
      revision: 37
      datasource: Prometheus
    kubernetes-pods:
      gnetId: 6417  # Kubernetes Pods
      revision: 1
      datasource: Prometheus
    some-dashboard:
      json: |
        $RAW_JSON
    custom-dashboard:
      file: dashboards/custom-dashboard.json
    prometheus-stats:
      title: My Custom Dashboard Title   # optional; overrides the dashboard title in the downloaded JSON
      gnetId: 2
      revision: 2
      datasource: Prometheus
    local-dashboard:
      url: https://example.com/repository/test.json
      curlOptions: "-sLf"
      token: ''
    local-dashboard-base64:
      url: https://example.com/repository/test-b64.json
      token: ''
      b64content: true
    local-dashboard-gitlab:
      url: https://example.com/repository/test-gitlab.json
      gitlabToken: ''
    local-dashboard-bitbucket:
      url: https://example.com/repository/test-bitbucket.json
      bearerToken: ''
    local-dashboard-azure:
      url: https://example.com/repository/test-azure.json
      basic: ''
      acceptHeader: '*/*'

# Security & Tweaks
grafana.ini:
  server:
    protocol: http
    domain: grafana.traipoap.com
    root_url: http://grafana.traipoap.com/ # replace with your domain
  security:
    allow_embedding: true
    cookie_samesite: lax
  auth.anonymous:
    enabled: false  # Disable anonymous access for security
