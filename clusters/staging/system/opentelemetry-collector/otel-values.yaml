mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
  #tag: 0.145.0 (Optional:specify a version, or it defaults to the latest verified by the chart)
resources:
  limits:
    cpu: 256m
    memory: 256Mi
  requests:
    cpu: 128m
    memory: 128Mi
service:
  type: NodePort

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    nodePort: 30317
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    nodePort: 30318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true

#OpenTelemetry Collector Configuration
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    hostmetrics:
          collection_interval: 30s
          scrapers:
            cpu:
            memory:
            disk:
            filesystem:
            load:
            network:
            process:
              mute_process_name_error: true
              mute_process_io_error: true
              mute_process_user_error: true
  processors:
    # Batch processor for better performance
    batch:
      timeout: 10s
      send_batch_size: 512
    # Memory limiter to prevent OOM
    memory_limiter:
      check_interval: 5s
      limit_mib: 256
      spike_limit_mib: 64
    # Resource detection for Kubernetes
    resourcedetection:
      detectors: [env, system]
      timeout: 5s
    # Enrich logs/metrics with Kubernetes metadata
    k8s_attributes:
      auth_type: "serviceAccount"
      passthrough: false
      filter:
        node_from_env_var: OTEL_K8S_NODE_NAME
      extract:
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.namespace.name
          - k8s.node.name
          - k8s.container.name
        labels:
          - tag_name: app
            key: app
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.name
            - from: resource_attribute
              name: k8s.namespace.name
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: connection
    # Resource processor to create user-friendly labels for Loki
    resource:
      attributes:
        - key: namespace
          from_attribute: k8s.namespace.name
          action: insert
        - key: pod
          from_attribute: k8s.pod.name
          action: insert
        - key: container
          from_attribute: k8s.container.name
          action: insert
    # Attributes processor for adding metadata
    attributes:
      actions:
        - key: environment
          value: non-production
          action: insert
  exporters:
    # Prometheus exporter for metrics
    prometheus:
      endpoint: "0.0.0.0:8889"
      namespace: otel
      const_labels:
        environment: nonprod
    # Prometheus Remote Write (if using Prometheus server)
    prometheusremotewrite:
      endpoint: http://prometheus-server/api/v1/write
      tls:
        insecure: true
    # Loki exporter for logs
    otlp_http/loki:
      endpoint: http://loki.logging.svc.cluster.local:3100/otlp
      tls:
        insecure: true
      # Optimization for cross-region or network latency
      sending_queue:
        enabled: true
        queue_size: 5000
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_elapsed_time: 300s

  service:
    pipelines:
      # Traces pipeline
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resourcedetection, attributes, batch]
        # exporters: [debug]
      # Metrics pipeline
      metrics:
        receivers: [otlp, prometheus, hostmetrics]
        processors: [memory_limiter, resourcedetection, attributes, batch]
        exporters: [prometheus, prometheusremotewrite] #, debug]
      # Logs pipeline
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, resource, resourcedetection, attributes, batch]
        exporters: [otlp_http/loki] #, debug]

# ClusterRole section
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "nodes"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["extensions"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]

# Service Account
serviceAccount:
  create: true
  name: otel-collector

# Security context - Root required to read host logs
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0

# Volumes for host logs
# extraVolumes:
#   - name: varlogpods
#     hostPath:
#       path: /var/log/pods
