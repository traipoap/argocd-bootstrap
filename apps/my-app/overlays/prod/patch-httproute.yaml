# NOTE: this patch keeps the FULL rules array on purpose. Kustomize applies
# patches to CRDs (HTTPRoute) with JSON-merge semantics, where arrays are
# replaced wholesale — a partial `rules` list would drop other rules.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-httproute
spec:
  parentRefs:
  - name: app-gateway
    namespace: istio-system
  hostnames:
  - "k3s-origin.traipoap.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

    backendRefs:
    - name: frontend-svc
      port: 80
      weight: 100

  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend-svc
      port: 8080
      weight: 100
