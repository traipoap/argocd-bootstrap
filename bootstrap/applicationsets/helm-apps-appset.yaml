apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: business-helm-applications
  namespace: argocd
  # Helm-chart apps: apps/<app>/ contains Chart.yaml + templates/, and
  # apps/<app>/overlays/<env>/values.yaml holds the per-env values diff.
  # (Kustomize apps like my-app are handled by business-applications.)
spec:
  generators:
    - git:
        repoURL: 'https://github.com/traipoap/argocd-bootstrap'
        revision: HEAD
        directories:
          # Helm-chart apps — add new ones here, e.g. apps/<new-app>/overlays/*
          # (Kustomize apps like my-app are handled by business-applications,
          # so keep them out of this pattern)
          - path: apps/microservices-demo/overlays/production
  template:
    metadata:
      name: 'microservices-demo' # e.g. microservices-demo-staging
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      source:
        repoURL: 'https://github.com/traipoap/argocd-bootstrap'
        targetRevision: HEAD
        # Directory containing Chart.yaml (exactly one chart in dir).
        path: apps/microservices-demo
        # Explicit chart name (from Chart.yaml) so resolution is unambiguous
        # across ArgoCD versions.
        chart: onlineboutique
        valueFiles:
          - apps/microservices-demo/overlays/production/values.yaml
        helm:
          releaseName: 'microservices-demo'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: 'microservices-demo'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
