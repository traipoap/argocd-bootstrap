apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-infrastructure
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/traipoap/argocd-bootstrap'
        revision: HEAD
        directories:
          - path: clusters/staging/system/*
  template:
    metadata:
      name: 'infra-{{path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: default
      source:
        repoURL: 'https://github.com/traipoap/argocd-bootstrap'
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
