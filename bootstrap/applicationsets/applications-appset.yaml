apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: business-applications
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: ghcr.io/traipoap/frontend
    argocd-image-updater.argoproj.io/ghcr.io.my-org.my-app.update-strategy: semver:~1.0
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  generators:
    - git:
        repoURL: 'https://github.com/traipoap/argocd-bootstrap'
        revision: HEAD
        directories:
          - path: apps/*/overlays/*
  template:
    metadata:
      name: '{{path[1]}}-{{path[3]}}' # ผลลัพธ์: my-app-production
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      source:
        repoURL: 'https://github.com/traipoap/argocd-bootstrap'
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{path[1]}}-{{path[3]}}'
      syncPolicy:
        automated:
          prune: true
          # selfHeal: true
        syncOptions:
          - CreateNamespace=true
